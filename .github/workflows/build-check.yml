name: Build check

# Runs the exact same steps Vercel runs (prebuild: migrate-turso + sync-brain,
# then next build) against the real database, on every push and PR. GitHub
# Actions has open internet access and its logs are readable through the
# GitHub API, unlike Vercel's build logs — so a failure here is something
# that can be diagnosed directly from the log instead of a screenshot.

on:
  push:
  pull_request:

# push and pull_request both fire for the same commit on a PR branch, and
# both runs mutate the same shared Turso database via sync-brain — running
# them concurrently raced and produced duplicate-slug failures. Serialize
# same-commit runs instead of letting them overlap.
concurrency:
  group: build-check-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
